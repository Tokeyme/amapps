<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AM Apps — Apps for iOS &amp; Android</title>
  <meta name="description" content="Apps for iOS and Android by Andreas Maier." />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="apple-touch-icon" href="favicon.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <a class="brand" href="./" aria-label="AM Apps — Home">
      <img class="logo" src="assets/am-logo.png" alt="" width="291" height="170" />
      <span class="brand-name">Apps</span>
    </a>

    <div class="lang-switch" role="group" aria-label="Language / Sprache">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="de">DE</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1 data-i18n="hero_tagline">Apps for iOS &amp; Android</h1>
      <p class="hero-sub" data-i18n="hero_sub"></p>
      <p class="hero-by" data-i18n="hero_by"></p>
    </section>

    <section class="apps" aria-labelledby="apps-heading">
      <h2 id="apps-heading" data-i18n="apps_heading">The apps</h2>

      <div class="grid">

        <!-- Podcast AM -->
        <article class="card">
          <div class="card-head">
            <img class="icon" src="assets/podcast.png" alt="" width="60" height="60" />
            <div class="card-text">
              <h3 data-i18n="app_podcast_name">Podcast AM</h3>
              <p data-i18n="app_podcast_desc"></p>
            </div>
          </div>

          <div class="shots">
            <button class="shot" type="button" data-shot="podcast-1" data-full="assets/shots/podcast-1-lg.jpg">
              <img src="assets/shots/podcast-1.jpg" alt="" width="300" height="650" loading="lazy" />
            </button>
            <button class="shot" type="button" data-shot="podcast-2" data-full="assets/shots/podcast-2-lg.jpg">
              <img src="assets/shots/podcast-2.jpg" alt="" width="300" height="650" loading="lazy" />
            </button>
          </div>

          <div class="stores">
            <a class="badge-link" href="https://apps.apple.com/app/id1604019625" target="_blank" rel="noopener">
              <img class="badge badge-apple" src="assets/badges/apple-en.svg" alt="Download on the App Store" data-badge="apple" width="120" height="40" />
            </a>
            <a class="badge-link" href="https://play.google.com/store/apps/details?id=com.podcastam.podcast_am" target="_blank" rel="noopener">
              <img class="badge badge-google" src="assets/badges/google-en.png" alt="Get it on Google Play" data-badge="google" width="646" height="250" />
            </a>
          </div>
        </article>

        <!-- Umrechner / Converter AM -->
        <article class="card">
          <div class="card-head">
            <img class="icon" src="assets/converter.png" alt="" width="60" height="60" />
            <div class="card-text">
              <h3 data-i18n="app_converter_name">Converter AM</h3>
              <p data-i18n="app_converter_desc"></p>
            </div>
          </div>

          <div class="shots">
            <button class="shot" type="button" data-shot="converter-{lang}-1" data-full="assets/shots/converter-en-1-lg.jpg">
              <img src="assets/shots/converter-en-1.jpg" alt="" width="300" height="533" loading="lazy" />
            </button>
            <button class="shot" type="button" data-shot="converter-{lang}-2" data-full="assets/shots/converter-en-2-lg.jpg">
              <img src="assets/shots/converter-en-2.jpg" alt="" width="300" height="533" loading="lazy" />
            </button>
          </div>

          <div class="stores">
            <a class="badge-link" href="https://apps.apple.com/app/id1450259074" target="_blank" rel="noopener">
              <img class="badge badge-apple" src="assets/badges/apple-en.svg" alt="Download on the App Store" data-badge="apple" width="120" height="40" />
            </a>
            <a class="badge-link" href="https://play.google.com/store/apps/details?id=app.amapps.converter" target="_blank" rel="noopener">
              <img class="badge badge-google" src="assets/badges/google-en.png" alt="Get it on Google Play" data-badge="google" width="646" height="250" />
            </a>
          </div>
        </article>

        <!-- Rapport AM -->
        <article class="card">
          <div class="card-head">
            <img class="icon" src="assets/rapport.png" alt="" width="60" height="60" />
            <div class="card-text">
              <h3 data-i18n="app_rapport_name">Rapport AM</h3>
              <p data-i18n="app_rapport_desc"></p>
            </div>
          </div>

          <div class="shots">
            <button class="shot" type="button" data-shot="rapport-1" data-full="assets/shots/rapport-1-lg.jpg">
              <img src="assets/shots/rapport-1.jpg" alt="" width="300" height="652" loading="lazy" />
            </button>
            <button class="shot" type="button" data-shot="rapport-2" data-full="assets/shots/rapport-2-lg.jpg">
              <img src="assets/shots/rapport-2.jpg" alt="" width="300" height="652" loading="lazy" />
            </button>
          </div>

          <p class="avail" data-i18n="avail_rapport"></p>

          <div class="stores">
            <a class="badge-link" href="https://apps.apple.com/de/app/id6797967865" target="_blank" rel="noopener">
              <img class="badge badge-apple" src="assets/badges/apple-en.svg" alt="Download on the App Store" data-badge="apple" width="120" height="40" />
            </a>
            <a class="badge-link" href="https://play.google.com/store/apps/details?id=com.rapportam.app" target="_blank" rel="noopener">
              <img class="badge badge-google" src="assets/badges/google-en.png" alt="Get it on Google Play" data-badge="google" width="646" height="250" />
            </a>
          </div>
        </article>

        <!-- Fest AM -->
        <article class="card">
          <div class="card-head">
            <img class="icon" src="assets/feste.png" alt="" width="60" height="60" />
            <div class="card-text">
              <h3 data-i18n="app_feste_name">Fest AM</h3>
              <p data-i18n="app_feste_desc"></p>
            </div>
          </div>

          <div class="shots">
            <button class="shot" type="button" data-shot="feste-1" data-full="assets/shots/feste-1-lg.jpg">
              <img src="assets/shots/feste-1.jpg" alt="" width="300" height="652" loading="lazy" />
            </button>
            <button class="shot" type="button" data-shot="feste-2" data-full="assets/shots/feste-2-lg.jpg">
              <img src="assets/shots/feste-2.jpg" alt="" width="300" height="652" loading="lazy" />
            </button>
          </div>

          <p class="avail" data-i18n="avail_feste"></p>

          <div class="stores">
            <a class="badge-link" href="https://apps.apple.com/de/app/id6781781563" target="_blank" rel="noopener">
              <img class="badge badge-apple" src="assets/badges/apple-en.svg" alt="Download on the App Store" data-badge="apple" width="120" height="40" />
            </a>
            <a class="badge-link" href="https://play.google.com/store/apps/details?id=com.festivalsam.app" target="_blank" rel="noopener">
              <img class="badge badge-google" src="assets/badges/google-en.png" alt="Get it on Google Play" data-badge="google" width="646" height="250" />
            </a>
            <a class="store" href="https://festam.app" target="_blank" rel="noopener" data-i18n="btn_web">Open in browser</a>
          </div>
        </article>

        <!-- Radio AM -->
        <article class="card">
          <div class="card-head">
            <img class="icon" src="assets/radio.png" alt="" width="60" height="60" />
            <div class="card-text">
              <h3 data-i18n="app_radio_name">Radio AM</h3>
              <p data-i18n="app_radio_desc"></p>
            </div>
          </div>

          <div class="shots">
            <button class="shot" type="button" data-shot="radio-{lang}-1" data-full="assets/shots/radio-en-1-lg.jpg">
              <img src="assets/shots/radio-en-1.jpg" alt="" width="300" height="533" loading="lazy" />
            </button>
            <button class="shot" type="button" data-shot="radio-{lang}-2" data-full="assets/shots/radio-en-2-lg.jpg">
              <img src="assets/shots/radio-en-2.jpg" alt="" width="300" height="533" loading="lazy" />
            </button>
          </div>

          <details class="avail avail-more">
            <summary data-i18n="avail_radio"></summary>
            <p data-i18n="avail_radio_list"></p>
          </details>

          <div class="stores">
            <a class="badge-link" href="https://play.google.com/store/apps/details?id=com.amapps.radio" target="_blank" rel="noopener">
              <img class="badge badge-google" src="assets/badges/google-en.png" alt="Get it on Google Play" data-badge="google" width="646" height="250" />
            </a>
          </div>
        </article>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-made" data-i18n="footer_made"></p>
    <nav class="footer-links">
      <a href="impressum.html" data-i18n="footer_imprint">Impressum</a>
      <span aria-hidden="true">·</span>
      <a href="datenschutz.html" data-i18n="footer_privacy">Datenschutz</a>
    </nav>
    <p class="copy">© 2026 Andreas Maier</p>
  </footer>

  <!-- Screenshot-Vollansicht -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lightbox-close" type="button" id="lightbox-close" aria-label="Close">&times;</button>
    <img id="lightbox-img" src="" alt="" />
  </div>

  <script src="app.js"></script>
  <!-- Cloudflare Web Analytics (cookieless) -->
  <script defer src="https://static.cloudflareinsights.com/beacon.min.js" data-cf-beacon='{"token": "127ba999be8e488f868aa8134bfeface"}'></script>
</body>
</html>
